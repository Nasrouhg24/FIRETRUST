[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "firetrust"
version = "0.1.0"
description = "Auditable NASA FIRMS fire observation and evidence explorer"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "numpy>=2,<3", "scikit-learn>=1.6,<2", "h3>=4.2,<5", "duckdb>=1.2,<3", "joblib>=1.4,<2", "scipy>=1.13,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
firetrust = "firetrust.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
